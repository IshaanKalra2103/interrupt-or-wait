[project]
name = "interrupt-or-wait"
version = "0.1.0"
description = "CMSC723 final project: interrupt vs. wait delivery of instructions to coding agents (harness on mini-SWE-agent)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "mini-swe-agent @ git+https://github.com/SWE-agent/mini-swe-agent@04d809ce",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
